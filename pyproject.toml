[project]
name = "factcheck"
version = "0.1.0"
description = "trace cites"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "youtube-transcript-api>=1.0",
    "playwright>=1.40",
]

[project.scripts]
factcheck = "factcheck.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/factcheck"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# RUF001-003: full-width Chinese punctuation is intentional, don't warn
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
files = ["src"]
mypy_path = "src"

[tool.importlinter]
root_package = "factcheck"

[[tool.importlinter.contracts]]
name = "Layers: upper layers may import lower ones, siblings must not import each other"
type = "layers"
layers = [
    "factcheck.cli",
    "factcheck.annotate | factcheck.render | factcheck.evaluate | factcheck.sheet | factcheck.prep",
    "factcheck.verifier",
    "factcheck.io | factcheck.prompts | factcheck.llm | factcheck.fetch",
    "factcheck.text",
    "factcheck.models",
]
